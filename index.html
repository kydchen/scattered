<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scattered" />
    <meta name="description" content="Scattered is a minimalist, cross-platform canvas for freely arranging and connecting notes." />
    <script>
      (() => {
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          document.documentElement.dataset.theme = localStorage.getItem("scattered-theme") || systemTheme;
        } catch {
          document.documentElement.dataset.theme = systemTheme;
        }
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Scattered</title>
  </head>
  <body>
    <main id="viewport" aria-label="自由思考画布">
      <div id="gesture-surface" aria-hidden="true"></div>
      <div id="world" aria-live="polite">
        <svg id="connections" aria-label="标签连线">
          <defs>
            <marker id="edge-arrowhead" markerWidth="12" markerHeight="12" refX="10.4" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" overflow="visible">
              <path class="arrowhead" d="M1.4 1.5 10.4 6 1.4 10.5 4.2 6Z"></path>
            </marker>
          </defs>
          <g id="edge-layer"></g>
          <path id="link-preview" hidden></path>
        </svg>
        <div id="node-layer"></div>
      </div>

      <svg id="lasso-overlay" aria-hidden="true">
        <path id="lasso-path" hidden></path>
      </svg>

      <header class="app-mark" aria-label="画布标题">
        <button id="boards-button" class="boards-button" type="button" aria-label="打开画布列表" aria-expanded="false">
          <svg class="app-logo" viewBox="0 0 30 24" aria-hidden="true">
            <circle class="app-logo-dot dot-1" cx="5.2" cy="7" r="1.7"></circle>
            <circle class="app-logo-dot dot-2" cx="12.2" cy="4.8" r="2.2"></circle>
            <circle class="app-logo-dot dot-3" cx="14.7" cy="12.8" r="3.7"></circle>
            <circle class="app-logo-dot dot-4" cx="24.2" cy="7" r="1.4"></circle>
            <circle class="app-logo-dot dot-5" cx="24" cy="17" r="2.4"></circle>
            <circle class="app-logo-dot dot-6" cx="8.2" cy="20" r="1.3"></circle>
          </svg>
          <svg class="boards-disclosure" viewBox="0 0 8 5" aria-hidden="true">
            <path d="m1 1 3 3 3-3"></path>
          </svg>
        </button>
        <button id="board-title" type="button" aria-label="画布标题，双击编辑">Untitled</button>
        <input id="board-title-editor" type="text" maxlength="120" aria-label="编辑画布标题" spellcheck="false" hidden />
      </header>

      <section id="board-picker" class="board-picker" aria-label="画布列表" hidden>
        <div class="board-picker-tools">
          <button id="new-board-button" type="button" aria-label="新建画布">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <button id="duplicate-board-button" type="button" aria-label="复制当前画布">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
          </button>
          <button id="restore-button" type="button" aria-label="恢复最近一次清空、覆盖或删除" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8V3m0 5h5M5.5 7A8 8 0 1 1 4 14"></path>
              <path d="M12 8v5l3 2"></path>
            </svg>
          </button>
          <button id="delete-board-button" class="danger" type="button" aria-label="删除当前画布">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"></path></svg>
          </button>
        </div>
        <div id="board-list" class="board-list" role="listbox" aria-label="本地画布"></div>
      </section>

      <section id="empty-state" class="empty-state" hidden>
        <div class="empty-state-visuals" aria-hidden="true">
          <svg viewBox="0 0 64 56">
            <rect x="8" y="15" width="48" height="30" rx="7"></rect>
            <circle cx="47" cy="13" r="3"></circle>
            <circle class="soft" cx="47" cy="13" r="8"></circle>
          </svg>
          <svg viewBox="0 0 64 56">
            <rect class="soft dashed" x="7" y="25" width="38" height="24" rx="6"></rect>
            <rect x="19" y="7" width="38" height="24" rx="6"></rect>
            <path d="M17 36 9 44m0-6v6h6"></path>
          </svg>
          <svg viewBox="0 0 64 56">
            <rect x="4" y="8" width="25" height="19" rx="5"></rect>
            <rect x="35" y="29" width="25" height="19" rx="5"></rect>
            <path d="M28 20c10 0 8 18 18 18"></path>
          </svg>
        </div>
        <p>双击任意位置创建卡片 <span aria-hidden="true">·</span> Double-tap anywhere to create a note</p>
      </section>

      <nav id="history-tools" class="history-tools" aria-label="视图、撤销与重做" hidden>
        <button id="fit-button" class="quiet-button" type="button" aria-label="居中显示全部标签" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
          </svg>
        </button>
        <button id="undo-button" class="quiet-button" type="button" aria-label="撤销" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"></path>
          </svg>
        </button>
        <button id="redo-button" class="quiet-button" type="button" aria-label="重做" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 7 5 5-5 5M19 12h-8a6 6 0 0 0-6 6"></path>
          </svg>
        </button>
      </nav>

      <button id="menu-button" class="quiet-button menu-button" type="button" aria-label="画布菜单" aria-expanded="false">•••</button>
      <section id="menu" class="menu" hidden aria-label="画布菜单">
        <button id="export-button" type="button" aria-label="导出备份">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M8 11l4 4 4-4M5 19h14"></path>
          </svg>
        </button>
        <button id="cancel-export-button" class="export-choice" type="button" aria-label="取消导出" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7l10 10M17 7 7 17"></path>
          </svg>
        </button>
        <button id="export-json-button" class="export-choice" type="button" aria-label="导出 JSON 备份" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4H8a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h1M15 4h1a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-1"></path>
          </svg>
        </button>
        <button id="export-svg-button" class="export-choice" type="button" aria-label="导出 SVG 矢量图" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="14" rx="3"></rect>
            <circle cx="15.5" cy="9.2" r="1.4"></circle>
            <path d="m6.5 16 4-4 3.2 3 2.1-2 2.2 3"></path>
          </svg>
        </button>
        <button id="export-mermaid-button" class="export-choice" type="button" aria-label="导出 Mermaid Markdown" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 7-5 5 5 5M15 7l5 5-5 5M13.5 4.5l-3 15"></path>
          </svg>
        </button>
        <button id="import-button" type="button" aria-label="导入备份">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15V3M8 7l4-4 4 4M5 19h14"></path>
          </svg>
        </button>
        <input id="import-input" type="file" accept="application/json,.json" hidden />
        <button id="search-button" type="button" aria-label="搜索标签">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 5 5"></path>
          </svg>
        </button>
        <a id="github-link" href="https://github.com/kydchen/scattered" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库">
          <svg viewBox="-1 -1 26 26" aria-hidden="true">
            <path fill="currentColor" stroke="none" d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path>
          </svg>
        </a>
        <button id="cancel-clear-button" type="button" aria-label="取消清空" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7l10 10M17 7 7 17"></path>
          </svg>
        </button>
        <button id="clear-button" class="danger" type="button" aria-label="清空画布">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"></path>
          </svg>
        </button>
      </section>

      <button id="theme-button" class="quiet-button theme-button" type="button" aria-label="切换到暗色模式" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-moon" d="M20 15.5A8.2 8.2 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"></path>
          <g class="theme-sun">
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
          </g>
        </svg>
      </button>

      <section id="selection-bar" class="selection-bar" aria-label="多选操作" hidden>
        <button id="color-selection" class="selection-action" type="button" aria-label="更改所选标签颜色">
          <svg class="color-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="9" r="5" fill="#e8cc66"></circle>
            <circle cx="15" cy="9" r="5" fill="#8fc9b0"></circle>
            <circle cx="12" cy="15" r="5" fill="#82a9df"></circle>
          </svg>
        </button>
        <button id="duplicate-selection" class="selection-action" type="button" aria-label="复制所选标签">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="2"></rect>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
          </svg>
        </button>
        <button id="arrow-selection" class="selection-action" type="button" aria-label="批量切换所选标签的连线箭头">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h16"></path>
            <path d="M15 7l5 5-5 5"></path>
          </svg>
        </button>
        <button id="disconnect-selection" class="selection-action" type="button" aria-label="断开所选标签的全部连线">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="4" cy="12" r="2.25" fill="currentColor" stroke="none"></circle>
            <circle cx="20" cy="12" r="2.25" fill="currentColor" stroke="none"></circle>
            <path d="M6.5 12h3M14.5 12h3M10.5 8.5l3 7M13.5 8.5l-3 7"></path>
          </svg>
        </button>
        <button id="delete-selection" class="selection-action danger" type="button" aria-label="删除所选标签">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"></path>
          </svg>
        </button>
      </section>

      <section id="edge-toolbar" class="edge-toolbar" aria-label="连线操作" hidden>
        <button id="edge-arrow" type="button" aria-label="添加正向箭头" aria-pressed="false" data-direction="none">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h16"></path>
            <path class="arrow-head arrow-head-forward" d="M15 7l5 5-5 5"></path>
            <path class="arrow-head arrow-head-reverse" d="M9 7l-5 5 5 5"></path>
          </svg>
        </button>
        <button id="edge-label" type="button" aria-label="编辑连线文字" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6h14M12 6v13M8.5 19h7"></path>
          </svg>
        </button>
        <button id="edge-delete" class="danger" type="button" aria-label="断开这条连线">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="4" cy="12" r="2.25" fill="currentColor" stroke="none"></circle>
            <circle cx="20" cy="12" r="2.25" fill="currentColor" stroke="none"></circle>
            <path d="M6.5 12h3M14.5 12h3M10.5 8.5l3 7M13.5 8.5l-3 7"></path>
          </svg>
        </button>
      </section>
      <input id="edge-label-editor" class="edge-label-editor" type="text" maxlength="120" aria-label="连线文字" hidden />

      <section id="color-palette" class="color-palette" aria-label="标签颜色" hidden>
        <button class="color-swatch" data-color="plain" type="button" aria-label="原白" aria-pressed="false"></button>
        <button class="color-swatch" data-color="yellow" type="button" aria-label="暖黄" aria-pressed="false"></button>
        <button class="color-swatch" data-color="mint" type="button" aria-label="薄荷绿" aria-pressed="false"></button>
        <button class="color-swatch" data-color="blue" type="button" aria-label="雾蓝" aria-pressed="false"></button>
        <button class="color-swatch" data-color="rose" type="button" aria-label="淡莓" aria-pressed="false"></button>
      </section>

      <section id="search-panel" class="search-panel" aria-label="搜索标签" hidden>
        <svg class="search-mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m15.5 15.5 5 5"></path>
        </svg>
        <input id="search-input" type="search" maxlength="200" placeholder="Find notes" autocomplete="off" enterkeyhint="search" aria-label="搜索标签文字" />
        <output id="search-count" aria-live="polite"></output>
        <button id="search-previous" type="button" aria-label="上一个搜索结果">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"></path></svg>
        </button>
        <button id="search-next" type="button" aria-label="下一个搜索结果">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
        </button>
        <button id="search-close" type="button" aria-label="关闭搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg>
        </button>
      </section>

      <div id="toast" class="toast" role="status" hidden></div>
    </main>

    <template id="node-template">
      <article class="node" tabindex="0">
        <div class="node-actions" role="toolbar" aria-label="标签操作">
          <button class="card-action color-handle" type="button" aria-label="更改标签颜色">
            <svg class="color-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="9" r="5" fill="#e8cc66"></circle>
              <circle cx="15" cy="9" r="5" fill="#8fc9b0"></circle>
              <circle cx="12" cy="15" r="5" fill="#82a9df"></circle>
            </svg>
          </button>
          <button class="card-action node-delete danger" type="button" aria-label="删除这张卡片">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"></path>
            </svg>
          </button>
        </div>
        <div class="node-text"></div>
        <textarea class="node-editor" rows="1" aria-label="想法内容" spellcheck="true" hidden></textarea>
        <button class="resize-handle" type="button" aria-label="调整标签宽度">
          <svg viewBox="0 0 36 18" aria-hidden="true">
            <path d="M2 9h32M7 4 2 9l5 5M29 4l5 5-5 5"></path>
          </svg>
        </button>
        <button class="link-handle" type="button" aria-label="拖到另一张卡片建立连接"></button>
      </article>
    </template>

    <script type="module" src="app.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "41d9c0c044944ad6b1bd274d2f27d9b7"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
