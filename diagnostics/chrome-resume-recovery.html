<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Chrome Resume Recovery Probe R3</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-x: none;
        overscroll-behavior-y: auto;
      }

      body {
        width: 100%;
        min-height: calc(100% + 2px);
        margin: 0;
        background: #eef2f7;
        color: #172033;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      #canvas-lock {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background-image: radial-gradient(circle, #d7deea 1px, transparent 1.2px);
        background-size: 28px 28px;
      }

      #gesture-lock {
        position: absolute;
        inset: 16px 0 0;
        touch-action: none;
      }

      #recovery-strip {
        position: fixed;
        z-index: 30;
        top: 0;
        right: 0;
        left: 0;
        height: 16px;
        touch-action: pan-y;
        background: rgba(83, 114, 168, 0.16);
      }

      .probe {
        z-index: 10;
        height: 48px;
        display: grid;
        place-items: center;
        padding: 0 8px;
        border: 2px solid #172033;
        border-radius: 10px;
        color: #172033;
        font-weight: 700;
        text-align: center;
      }

      #probe-a {
        position: fixed;
        top: max(22px, env(safe-area-inset-top));
        left: 12px;
        width: calc(50vw - 18px);
        background: #ff9f8f;
      }

      #probe-b {
        position: absolute;
        top: max(22px, env(safe-area-inset-top));
        right: 12px;
        width: calc(50vw - 18px);
        background: #8fddb1;
      }

      #probe-c {
        position: fixed;
        top: calc(max(22px, env(safe-area-inset-top)) + 60px);
        right: 12px;
        left: 12px;
        background: #94bdf4;
      }

      #probe-d {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 190px;
        background: #c7a6f5;
        transform: translate(-50%, -50%);
      }

      #probe-e {
        position: fixed;
        right: 12px;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 12px;
        background: #ffd878;
      }

      main {
        position: fixed;
        z-index: 12;
        top: 154px;
        right: 24px;
        left: 24px;
        max-width: 560px;
        margin: 0 auto;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 8px 0;
      }

      .build {
        color: #5f6b7d;
        font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #metrics {
        position: fixed;
        z-index: 20;
        top: 64%;
        right: 12px;
        left: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(20, 24, 32, 0.9);
        color: #fff;
        font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-lock">
      <div id="gesture-lock" aria-hidden="true"></div>
    </div>
    <div id="recovery-strip" aria-label="Native vertical recovery strip"></div>

    <div id="probe-a" class="probe">A · fixed top</div>
    <div id="probe-b" class="probe">B · absolute top</div>
    <div id="probe-c" class="probe">C · fixed top</div>

    <main>
      <h1>Chrome Resume Recovery</h1>
      <p class="build">R3 · 16px native pull strip + locked canvas</p>
      <p>冷恢复后若 A/B/C 消失：从网页最顶边向下短拉约 40px，在刷新圆圈出现前松手。</p>
      <p>请记录：按钮是否恢复、页面是否真的刷新，以及中部区域是否仍不能拖动网页。</p>
    </main>

    <div id="probe-d" class="probe">D · fixed middle</div>
    <pre id="metrics" aria-live="off">waiting</pre>
    <div id="probe-e" class="probe">E · fixed bottom</div>

    <script>
      (() => {
        const metrics = document.querySelector("#metrics");
        const strip = document.querySelector("#recovery-strip");
        const root = document.scrollingElement;
        const eventLog = [];
        const bootKey = "scattered-chrome-resume-r3-boots";
        const boots = Number(sessionStorage.getItem(bootKey) || 0) + 1;
        sessionStorage.setItem(bootKey, String(boots));

        function number(value) {
          return Number.isFinite(value) ? Math.round(value * 10) / 10 : "-";
        }

        function rect(id) {
          const bounds = document.querySelector(id).getBoundingClientRect();
          return `${number(bounds.top)}..${number(bounds.bottom)}`;
        }

        function record(label) {
          eventLog.push(label);
          if (eventLog.length > 6) eventLog.shift();
          const visual = window.visualViewport;
          const navigation = performance.getEntriesByType("navigation")[0]?.type || "unknown";
          const hit = document.elementFromPoint(8, 8);
          metrics.textContent = [
            `R3 ${label} · boot ${boots} ${navigation}`,
            `events ${eventLog.join(">")}`,
            `scroll ${number(scrollY)} root ${number(root?.scrollTop)}`,
            `window ${innerWidth}x${innerHeight} doc ${document.documentElement.clientHeight}/${document.documentElement.scrollHeight}`,
            `visual o${number(visual?.offsetTop)} p${number(visual?.pageTop)} h${number(visual?.height)} s${number(visual?.scale)}`,
            `rect A ${rect("#probe-a")} B ${rect("#probe-b")} C ${rect("#probe-c")}`,
            `rect D ${rect("#probe-d")} E ${rect("#probe-e")} hit ${hit?.id || hit?.tagName || "none"}`,
          ].join("\n");
        }

        window.addEventListener("pageshow", (event) => {
          record(`pageshow${event.persisted ? "P" : ""}`);
          requestAnimationFrame(() => record("raf"));
          setTimeout(() => record("800"), 800);
        });
        window.addEventListener("scroll", () => record("scroll"), { passive: true });
        window.addEventListener("resize", () => record("resize"), { passive: true });
        window.visualViewport?.addEventListener("scroll", () => record("vscroll"), { passive: true });
        window.visualViewport?.addEventListener("resize", () => record("vresize"), { passive: true });
        strip.addEventListener("pointerdown", () => record("strip-down"), { passive: true });
        strip.addEventListener("pointercancel", () => record("strip-cancel"), { passive: true });
        strip.addEventListener("pointerup", () => record("strip-up"), { passive: true });
        record("boot");
      })();
    </script>
  </body>
</html>
